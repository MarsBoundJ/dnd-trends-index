<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" style="background:#0a0a0a;font-family:Georgia,serif">
  <!-- ============================================================
       IP & LICENSING REPORT — 3 replacement sigil options
       Lucide-style monochromatic, ember on obsidian, 24×24 viewBox.
       ============================================================ -->

  <!-- Title -->
  <text x="40" y="42" fill="#e8e3d5" font-size="22" font-weight="700">IP &amp; Licensing Report — three new options</text>
  <text x="40" y="64" fill="#888" font-size="13" font-family="system-ui,sans-serif">All three lean analytical-framework. None of them read as "swap" or "exchange."</text>

  <!-- Header row -->
  <text x="160" y="115" fill="#888" font-size="11" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5" text-anchor="middle">OPTION A</text>
  <text x="400" y="115" fill="#888" font-size="11" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5" text-anchor="middle">OPTION B</text>
  <text x="640" y="115" fill="#888" font-size="11" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5" text-anchor="middle">OPTION C</text>

  <!-- Divider lines -->
  <line x1="40" y1="130" x2="760" y2="130" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="40" y1="340" x2="760" y2="340" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Option A: Decision Matrix (2x2 quadrant + plotted point + axis ticks) -->
  <svg x="120" y="150" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="12" x2="20" y2="12"/>
    <line x1="12" y1="4" x2="12" y2="20"/>
    <line x1="11" y1="4" x2="13" y2="4"/>
    <line x1="11" y1="20" x2="13" y2="20"/>
    <line x1="4" y1="11" x2="4" y2="13"/>
    <line x1="20" y1="11" x2="20" y2="13"/>
    <circle cx="16" cy="8" r="1.5" fill="#e87722"/>
  </svg>
  <text x="160" y="255" fill="#e8e3d5" font-size="13" font-family="system-ui,sans-serif" font-weight="600" text-anchor="middle">Decision Matrix</text>
  <text x="160" y="275" fill="#888" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">2×2 framework with a</text>
  <text x="160" y="290" fill="#888" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">plotted candidate in the</text>
  <text x="160" y="305" fill="#888" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">"greenlight" quadrant</text>

  <!-- Option B: Filter Funnel (analysis pipeline) -->
  <svg x="360" y="150" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="5" x2="20" y2="5"/>
    <line x1="4" y1="5" x2="10" y2="14"/>
    <line x1="20" y1="5" x2="14" y2="14"/>
    <line x1="10" y1="14" x2="10" y2="21"/>
    <line x1="14" y1="14" x2="14" y2="21"/>
    <line x1="10" y1="21" x2="14" y2="21"/>
  </svg>
  <text x="400" y="255" fill="#e8e3d5" font-size="13" font-family="system-ui,sans-serif" font-weight="600" text-anchor="middle">Filter Funnel</text>
  <text x="400" y="275" fill="#888" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">Inputs distilled into a</text>
  <text x="400" y="290" fill="#888" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">single decision —</text>
  <text x="400" y="305" fill="#888" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">"the decision engine"</text>

  <!-- Option C: Framework Document (report with matrix inside) -->
  <svg x="600" y="150" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="0.5"/>
    <line x1="7" y1="10" x2="17" y2="10"/>
    <line x1="12" y1="6" x2="12" y2="14"/>
    <circle cx="14.5" cy="8" r="0.9" fill="#e87722"/>
    <line x1="7" y1="17" x2="16" y2="17"/>
    <line x1="7" y1="19" x2="13" y2="19"/>
  </svg>
  <text x="640" y="255" fill="#e8e3d5" font-size="13" font-family="system-ui,sans-serif" font-weight="600" text-anchor="middle">Framework Document</text>
  <text x="640" y="275" fill="#888" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">Report page containing a</text>
  <text x="640" y="290" fill="#888" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">2×2 chart — combines</text>
  <text x="640" y="305" fill="#888" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">"report" + "framework"</text>
</svg>
