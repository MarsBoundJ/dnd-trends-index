    <line x1="6.5" y1="12" x2="15" y2="6"/>
    <line x1="6.5" y1="12" x2="19" y2="12"/>
    <line x1="6.5" y1="12" x2="15" y2="18"/>
    <circle cx="16" cy="6" r="1.5" fill="#e87722"/>
    <circle cx="20" cy="12" r="1.5" fill="#e87722"/>
    <circle cx="16" cy="18" r="1.5" fill="#e87722"/>
