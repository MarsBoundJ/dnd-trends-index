  <!-- 4B: Overlapping circles (Venn) -->
  <svg x="404" y="635" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="5"/>
    <circle cx="8" cy="15" r="5"/>
    <circle cx="16" cy="15" r="5"/>
  </svg>
  <text x="440" y="728" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Overlapping Sets</text>

