  <!-- Footer note -->
  <text x="40" y="1265" fill="#666" font-size="10" font-family="system-ui,sans-serif">Eyebrow tag suggestions shown in ember beside each report name. Stroke: #e87722. Body: parchment.</text>
</svg>
