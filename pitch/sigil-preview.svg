    <rect x="7" y="6" width="11" height="14" rx="1"/>
    <rect x="10" y="8" width="10" height="13" rx="1"/>
  </svg>
  <text x="440" y="248" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Stacked Cards</text>

  <!-- 1C: Lens over grid -->
  <svg x="604" y="155" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="0.8" fill="#e87722"/>
    <circle cx="11" cy="6" r="0.8" fill="#e87722"/>
    <circle cx="6" cy="11" r="0.8" fill="#e87722"/>
    <circle cx="11" cy="11" r="0.8" fill="#e87722"/>
    <circle cx="14" cy="14" r="5"/>
    <line x1="17.5" y1="17.5" x2="20.5" y2="20.5"/>
  </svg>
  <text x="640" y="248" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Lens on Grid</text>

  <!-- =========================================================== -->
  <!-- ROW 2 — IP & LICENSING REPORT -->
  <!-- =========================================================== -->
  <text x="40" y="315" fill="#e8e3d5" font-size="15" font-weight="600">IP &amp; Licensing Report</text>
  <text x="40" y="335" fill="#888" font-size="11" font-family="system-ui,sans-serif">Comprehensive licensing analysis</text>
  <text x="40" y="355" fill="#e87722" font-size="10" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5">LICENSING BRIEF</text>

  <!-- 2A: Converging arrows -->
  <svg x="204" y="315" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="10" y2="12"/>
    <polyline points="8,9 11,12 8,15"/>
    <line x1="21" y1="12" x2="14" y2="12"/>
    <polyline points="16,9 13,12 16,15"/>
  </svg>
  <text x="240" y="408" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Converging Arrows</text>

  <!-- 2B: Sealed scroll -->
  <svg x="404" y="315" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 4 L 18 4 L 18 19 L 6 19 Z"/>
    <line x1="9" y1="8" x2="15" y2="8"/>
