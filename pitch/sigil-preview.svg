  <text x="440" y="100" fill="#888" font-size="11" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5">OPTION B</text>
  <text x="640" y="100" fill="#888" font-size="11" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5">OPTION C</text>

  <!-- Row divider lines -->
  <line x1="40" y1="115" x2="860" y2="115" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="40" y1="275" x2="860" y2="275" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="40" y1="435" x2="860" y2="435" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="40" y1="595" x2="860" y2="595" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="40" y1="755" x2="860" y2="755" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="40" y1="915" x2="860" y2="915" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="40" y1="1075" x2="860" y2="1075" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="40" y1="1235" x2="860" y2="1235" stroke="#2a2a2a" stroke-width="1"/>

  <!-- =========================================================== -->
  <!-- ROW 1 — IP DEEP DIVE -->
  <!-- =========================================================== -->
  <text x="40" y="155" fill="#e8e3d5" font-size="15" font-weight="600">IP Deep Dive</text>
  <text x="40" y="175" fill="#888" font-size="11" font-family="system-ui,sans-serif">19 Licensing Candidates</text>
  <text x="40" y="195" fill="#e87722" font-size="10" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5">DEEP DIVE</text>

  <!-- 1A: Radial burst — center dot + 12 radiating ticks -->
  <svg x="204" y="155" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="1.5" fill="#e87722"/>
    <line x1="12" y1="3" x2="12" y2="6.5"/>
    <line x1="16.5" y1="4.2" x2="14.75" y2="7.25"/>
    <line x1="19.8" y1="7.5" x2="16.75" y2="9.25"/>
    <line x1="21" y1="12" x2="17.5" y2="12"/>
    <line x1="19.8" y1="16.5" x2="16.75" y2="14.75"/>
    <line x1="16.5" y1="19.8" x2="14.75" y2="16.75"/>
    <line x1="12" y1="21" x2="12" y2="17.5"/>
    <line x1="7.5" y1="19.8" x2="9.25" y2="16.75"/>
    <line x1="4.2" y1="16.5" x2="7.25" y2="14.75"/>
    <line x1="3" y1="12" x2="6.5" y2="12"/>
    <line x1="4.2" y1="7.5" x2="7.25" y2="9.25"/>
    <line x1="7.5" y1="4.2" x2="9.25" y2="7.25"/>
  </svg>
  <text x="240" y="248" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Radial Burst</text>

  <!-- 1B: Stacked cards -->
  <svg x="404" y="155" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
