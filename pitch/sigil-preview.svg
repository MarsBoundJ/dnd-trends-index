  </svg>
  <text x="440" y="888" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Focused Lens</text>

  <!-- 5C: Evidence ladder (ascending bars) -->
  <svg x="604" y="795" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="15" width="4" height="5"/>
    <rect x="10" y="10" width="4" height="10"/>
    <rect x="16" y="5" width="4" height="15"/>
  </svg>
  <text x="640" y="888" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Evidence Ladder</text>

  <!-- =========================================================== -->
  <!-- ROW 6 — IP ONE-PAGER -->
  <!-- =========================================================== -->
  <text x="40" y="955" fill="#e8e3d5" font-size="15" font-weight="600">IP One-pager</text>
  <text x="40" y="975" fill="#888" font-size="11" font-family="system-ui,sans-serif">Compact IP pitch</text>
  <text x="40" y="995" fill="#e87722" font-size="10" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5">ONE-PAGER · IP</text>

  <!-- 6A: Folded sheet -->
  <svg x="204" y="955" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 5 4 L 16 4 L 19 7 L 19 20 L 5 20 Z"/>
    <path d="M 16 4 L 16 7 L 19 7"/>
    <line x1="8" y1="12" x2="16" y2="12"/>
    <line x1="8" y1="15" x2="13" y2="15"/>
  </svg>
  <text x="240" y="1048" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Folded Sheet</text>

  <!-- 6B: Page with star -->
  <svg x="404" y="955" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="4" width="12" height="16" rx="0.5"/>
    <path d="M 12 8 L 13 10.5 L 15.5 10.8 L 13.7 12.5 L 14.2 15 L 12 13.8 L 9.8 15 L 10.3 12.5 L 8.5 10.8 L 11 10.5 Z"/>
    <line x1="8" y1="17" x2="16" y2="17"/>
  </svg>
  <text x="440" y="1048" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Page with Star</text>

  <!-- 6C: Pointer needle -->
  <svg x="604" y="955" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="3" x2="12" y2="21"/>
    <path d="M 9 7 L 12 3 L 15 7 Z" fill="#e87722"/>
    <path d="M 9 17 L 12 21 L 15 17 Z"/>
  </svg>
  <text x="640" y="1048" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Pointer Needle</text>

  <!-- =========================================================== -->
  <!-- ROW 7 — CAPABILITIES ONE-PAGER -->
  <!-- =========================================================== -->
  <text x="40" y="1115" fill="#e8e3d5" font-size="15" font-weight="600">Capabilities One-pager</text>
  <text x="40" y="1135" fill="#888" font-size="11" font-family="system-ui,sans-serif">What Trusight does</text>
  <text x="40" y="1155" fill="#e87722" font-size="10" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5">ONE-PAGER · CAPABILITIES</text>

  <!-- 7A: Hexagon node (capabilities hub) -->
  <svg x="204" y="1115" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 3 L 20 7.5 L 20 16.5 L 12 21 L 4 16.5 L 4 7.5 Z"/>
    <line x1="12" y1="12" x2="12" y2="6"/>
    <line x1="12" y1="12" x2="17" y2="14.5"/>
    <line x1="12" y1="12" x2="7" y2="14.5"/>
  </svg>
  <text x="240" y="1208" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Hex Hub</text>

  <!-- 7B: Grid menu -->
  <svg x="404" y="1115" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="5" width="5" height="5" rx="0.5"/>
    <rect x="10" y="5" width="5" height="5" rx="0.5"/>
    <rect x="16" y="5" width="4" height="5" rx="0.5"/>
    <rect x="4" y="13" width="5" height="5" rx="0.5"/>
    <rect x="10" y="13" width="5" height="5" rx="0.5"/>
    <rect x="16" y="13" width="4" height="5" rx="0.5"/>
  </svg>
  <text x="440" y="1208" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Grid Menu</text>

  <!-- 7C: Branching tree -->
  <svg x="604" y="1115" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
