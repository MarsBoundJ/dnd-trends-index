    <circle cx="19" cy="12" r="2.5"/>
    <line x1="7.5" y1="12" x2="16.5" y2="12"/>
  </svg>
  <text x="640" y="408" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Bridge</text>

