<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280" style="background:#0a0a0a;font-family:Georgia,serif">
  <!-- ============================================================
       TRUSIGHT REPORT SIGILS — 7 reports × 3 options each.
       Each sigil drawn at 24×24 viewBox, displayed at 72×72.
       Stroke = ember #e87722, weight 1.75.
       ============================================================ -->

  <!-- Title -->
  <text x="40" y="42" fill="#e8e3d5" font-size="24" font-weight="700">Trusight Report Sigils — three options per report</text>
  <text x="40" y="64" fill="#888" font-size="13" font-family="system-ui,sans-serif">Lucide-style monochromatic, ember on obsidian. Each rendered at 72×72.</text>

  <!-- Column headers -->
