  <!-- ROW 3 — A1 LIVE UA AUDIT -->
  <!-- =========================================================== -->
  <text x="40" y="475" fill="#e8e3d5" font-size="15" font-weight="600">A1 LIVE UA Audit</text>
  <text x="40" y="495" fill="#888" font-size="11" font-family="system-ui,sans-serif">Live playtest sentiment</text>
  <text x="40" y="515" fill="#e87722" font-size="10" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5">SENTIMENT AUDIT</text>

  <!-- 3A: Sentiment waveform -->
  <svg x="204" y="475" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#e87722" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
