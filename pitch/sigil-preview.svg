    <line x1="4.5" y1="9" x2="6.5" y2="9"/>
    <line x1="4" y1="12" x2="7" y2="12"/>
    <rect x="9.5" y="4" width="5" height="16" rx="0.5"/>
    <line x1="11" y1="9" x2="13" y2="9"/>
    <line x1="10.5" y1="12" x2="13.5" y2="12"/>
    <rect x="16" y="4" width="5" height="16" rx="0.5"/>
    <line x1="17.5" y1="9" x2="19.5" y2="9"/>
    <line x1="17" y1="12" x2="20" y2="12"/>
  </svg>
  <text x="640" y="728" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">ID Cards</text>

  <!-- =========================================================== -->
  <!-- ROW 5 — PERSONA A PROOFS -->
  <!-- =========================================================== -->
  <text x="40" y="795" fill="#e8e3d5" font-size="15" font-weight="600">Persona A Proofs</text>
  <text x="40" y="815" fill="#888" font-size="11" font-family="system-ui,sans-serif">Evidence backing the persona</text>
  <text x="40" y="835" fill="#e87722" font-size="10" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="1.5">EVIDENCE FILE</text>

  <!-- 5A: Verified document -->
