<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Library Clerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #0a0a0c;
            --glass-panel: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --color-primary: #00d4ff;
            --color-archive: #ff3377;
            --color-approve: #00ff88;
            --color-warn: #ffaa00;
            --color-competitor: #cc88ff;
            --color-insight: #00d4ff;
            --color-concept: #00ff88;
            --color-noise: #ff3377;
            --text-main: #e0e0e0;
            --text-muted: #8888aa;
            --glow-primary: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        body {
            background-color: var(--bg-obsidian);
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, var(--bg-obsidian) 70%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--color-primary);
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        /* ── Tabs ──────────────────────────────────────────────── */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.75rem;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 6px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .tab-btn:hover { color: var(--text-main); border-color: var(--color-primary); }
        .tab-btn.active {
            color: var(--color-primary);
            border-color: var(--color-primary);
            background: rgba(0, 212, 255, 0.08);
        }

        .badge {
            display: inline-block;
            background: var(--color-warn);
            color: #000;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            border-radius: 10px;
            padding: 1px 6px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        /* ── Shared cards ────────────────────────────────────────── */
        .search-card, .panel-card {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            margin-bottom: 1.5rem;
            box-shadow: var(--glow-primary);
        }

        .search-box { display: flex; gap: 1rem; }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 10px 16px;
            color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--color-primary); }

        /* ── Buttons ─────────────────────────────────────────────── */
        button.search-btn {
            background: var(--color-primary);
            color: #000;
            border: none;
            padding: 0 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: transform 0.1s;
            white-space: nowrap;
        }
        button.search-btn:active { transform: scale(0.98); }

        .btn {
            padding: 5px 11px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            border: 1px solid transparent;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-update  { border-color: var(--color-primary); color: var(--color-primary); background: rgba(0,212,255,0.05); }
        .btn-update:hover  { background: var(--color-primary); color: #000; }
        .btn-archive { border-color: var(--color-archive); color: var(--color-archive); background: rgba(255,51,119,0.05); }
        .btn-archive:hover { background: var(--color-archive); color: #fff; }
        .btn-approve { border-color: var(--color-approve); color: var(--color-approve); background: rgba(0,255,136,0.05); }
        .btn-approve:hover { background: var(--color-approve); color: #000; }
        .btn-reject  { border-color: var(--color-archive); color: var(--color-archive); background: rgba(255,51,119,0.05); }
        .btn-reject:hover  { background: var(--color-archive); color: #fff; }
        .btn-edit    { border-color: var(--color-warn); color: var(--color-warn); background: rgba(255,170,0,0.05); }
        .btn-edit:hover    { background: var(--color-warn); color: #000; }
        .btn-add     { border-color: var(--color-approve); color: var(--color-approve); background: rgba(0,255,136,0.05); }
        .btn-add:hover     { background: var(--color-approve); color: #000; }
        .btn-toggle-on  { border-color: var(--color-archive); color: var(--color-archive); background: rgba(255,51,119,0.05); }
        .btn-toggle-on:hover  { background: var(--color-archive); color: #fff; }
        .btn-toggle-off { border-color: var(--color-approve); color: var(--color-approve); background: rgba(0,255,136,0.05); }
        .btn-toggle-off:hover { background: var(--color-approve); color: #000; }

        .action-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; }

        /* ── Tables ──────────────────────────────────────────────── */
        .results-card {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 0.8rem 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--glass-border);
        }
        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: top;
            font-size: 0.9rem;
        }
        tr:last-child td { border-bottom: none; }

        select {
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid var(--glass-border);
            padding: 5px 8px;
            border-radius: 4px;
            outline: none;
            font-size: 0.85rem;
        }

        /* ── Bucket / category chips ────────────────────────────── */
        .chip {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .chip-concept    { background: rgba(0,255,136,0.15); color: var(--color-concept); border: 1px solid rgba(0,255,136,0.3); }
        .chip-insight    { background: rgba(0,212,255,0.15); color: var(--color-insight); border: 1px solid rgba(0,212,255,0.3); }
        .chip-competitor { background: rgba(204,136,255,0.15); color: var(--color-competitor); border: 1px solid rgba(204,136,255,0.3); }
        .chip-noise      { background: rgba(255,51,119,0.15); color: var(--color-noise); border: 1px solid rgba(255,51,119,0.3); }
        .chip-breakout   { background: rgba(255,170,0,0.2); color: var(--color-warn); border: 1px solid rgba(255,170,0,0.4); }

        .confidence-bar {
            width: 60px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-right: 4px;
        }
        .confidence-fill {
            height: 100%;
            border-radius: 3px;
        }

        /* ── Inline edit form for Review Queue ─────────────────── */
        .edit-row { background: rgba(255, 170, 0, 0.04) !important; }
        .edit-form {
            padding: 1rem;
            background: rgba(255,170,0,0.06);
            border-top: 1px solid rgba(255,170,0,0.2);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.75rem;
        }
        .edit-form label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 3px; }
        .edit-form select, .edit-form input { width: 100%; box-sizing: border-box; }
        .edit-form-actions { grid-column: 1/-1; display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.5rem; }

        /* ── Seeds table ─────────────────────────────────────────── */
        .seed-auto { color: var(--text-muted); font-size: 0.8rem; }
        .seed-manual { color: var(--color-warn); font-size: 0.8rem; }
        tr.seed-inactive td { opacity: 0.4; }

        /* ── Misc ────────────────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .reasoning-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
            max-width: 280px;
        }

        .status-msg {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 2rem;
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s ease-out;
            z-index: 100;
            font-weight: 600;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>LIBRARY <span style="color:#fff;">CLERK</span></h1>

    <!-- ── Tab Navigation ───────────────────────────────────────── -->
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('library')">LIBRARY</button>
        <button class="tab-btn" id="tab-btn-queue" onclick="showTab('queue')">
            REVIEW QUEUE <span class="badge" id="queue-badge" style="display:none">0</span>
        </button>
        <button class="tab-btn" onclick="showTab('seeds')">SEEDS</button>
    </div>

    <!-- ════════════════════════════════════════════════════════════
         TAB 1 — LIBRARY CLERK (existing functionality)
         ════════════════════════════════════════════════════════════ -->
    <div id="tab-library" class="tab-section active">
        <div class="search-card">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search 18k concepts (e.g., Fireball, Vecna, Monk)...">
                <button class="search-btn" onclick="performSearch()">SCRIBE</button>
            </div>
        </div>
        <div class="results-card">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>Concept Name</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr><td colspan="3" class="empty-state">Search above to view concepts.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════
         TAB 2 — REVIEW QUEUE
         ════════════════════════════════════════════════════════════ -->
    <div id="tab-queue" class="tab-section">
        <div class="panel-card" style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
            <span style="font-family:'Cinzel',serif; color:var(--color-warn); letter-spacing:1px;">PENDING REVIEW</span>
            <span id="queue-count" style="color:var(--text-muted); font-size:0.85rem;"></span>
            <div style="margin-left:auto; display:flex; gap:0.5rem;">
                <button class="search-btn" style="padding:8px 16px; font-size:0.8rem;" onclick="loadQueue('pending')">PENDING</button>
                <button class="search-btn" style="padding:8px 16px; font-size:0.8rem; background:#444; color:#ccc;" onclick="loadQueue('approved')">APPROVED</button>
                <button class="search-btn" style="padding:8px 16px; font-size:0.8rem; background:#444; color:#ccc;" onclick="loadQueue('rejected')">REJECTED</button>
            </div>
        </div>

        <div class="results-card">
            <table id="queue-table">
                <thead>
                    <tr>
                        <th>Term</th>
                        <th>Bucket</th>
                        <th>Signal / System</th>
                        <th>Confidence</th>
                        <th>Value</th>
                        <th>Seed</th>
                        <th>Reasoning</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="queue-body">
                    <tr><td colspan="8" class="empty-state">Loading review queue...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════
         TAB 3 — SEEDS
         ════════════════════════════════════════════════════════════ -->
    <div id="tab-seeds" class="tab-section">
        <div class="panel-card">
            <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
                <span style="font-family:'Cinzel',serif; color:var(--color-approve); letter-spacing:1px;">ADD SEED</span>
                <input type="text" id="new-seed-input" placeholder="Enter search term (e.g. dnd sorcerer)" style="flex:1; min-width:200px;">
                <input type="text" id="new-seed-notes" placeholder="Notes (optional)" style="flex:1; min-width:150px;">
                <button class="search-btn" onclick="addSeed()">ADD</button>
                <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; color:var(--text-muted); font-size:0.85rem;">
                    <input type="checkbox" id="show-inactive-seeds" onchange="loadSeeds()"> Show inactive
                </label>
            </div>
        </div>

        <div class="results-card">
            <table id="seeds-table">
                <thead>
                    <tr>
                        <th>Term</th>
                        <th>Added By</th>
                        <th>Source Concept</th>
                        <th>Notes</th>
                        <th>Added</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="seeds-body">
                    <tr><td colspan="6" class="empty-state">Loading seeds...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast" class="status-msg"></div>

<script>
    const API_BASE = "https://us-central1-dnd-trends-index.cloudfunctions.net/bouncer-api";

    const CATEGORIES = [
        "Class", "Subclass", "Spell", "Feat", "Monster", "Species & Lineage",
        "Magic Item", "Rules", "AI Art", "Actual Play", "Background", "Convention",
        "Deity", "Equipment", "Faction", "Homebrew Class", "Homebrew Subclass",
        "Influencer", "Location", "Lore", "NPC", "Party Role", "Rulebooks",
        "Setting", "TTRPG System", "UA", "Videogame BG3", "VTT Platform",
        "YouTube", "Other",
    ];

    const SIGNAL_CATEGORIES = [
        "new_player_acquisition", "product_dissatisfaction", "media_crossover",
        "ip_crossover", "competitive_intel", "other",
    ];

    const BUCKETS = ["concept", "insight", "competitor", "noise"];

    // ── Auth ──────────────────────────────────────────────────────
    function getRitualKey() {
        let key = sessionStorage.getItem('ritual_key');
        if (!key) {
            key = prompt("Library Clerk Key:");
            if (key) sessionStorage.setItem('ritual_key', key);
        }
        return key || '';
    }

    // ── Tabs ──────────────────────────────────────────────────────
    function showTab(name) {
        document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        document.querySelector(`.tab-btn[onclick="showTab('${name}')"]`).classList.add('active');
        if (name === 'queue') loadQueue('pending');
        if (name === 'seeds') loadSeeds();
    }

    // ══════════════════════════════════════════════════════════════
    // LIBRARY TAB (existing)
    // ══════════════════════════════════════════════════════════════

    async function performSearch() {
        const query = document.getElementById('search-input').value;
        if (!query) return;
        try {
            const res = await fetch(`${API_BASE}/system/library/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            renderResults(data);
        } catch (err) {
            showToast("Search failed: " + err.message, true);
        }
    }

    function renderResults(concepts) {
        const tbody = document.getElementById('results-body');
        tbody.innerHTML = '';
        if (!concepts.length) {
            tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No concepts found.</td></tr>';
            return;
        }
        concepts.forEach(concept => {
            const tr = document.createElement('tr');

            const tdName = document.createElement('td');
            tdName.textContent = concept.name;
            tdName.style.fontWeight = concept.is_active ? '600' : '400';
            if (!concept.is_active) tdName.style.color = '#666';
            tr.appendChild(tdName);

            const tdCat = document.createElement('td');
            const select = document.createElement('select');
            CATEGORIES.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.textContent = cat;
                if (cat === concept.category) opt.selected = true;
                select.appendChild(opt);
            });
            tdCat.appendChild(select);
            tr.appendChild(tdCat);

            const tdActions = document.createElement('td');
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'action-btns';

            const btnUpdate = document.createElement('button');
            btnUpdate.className = 'btn btn-update';
            btnUpdate.textContent = 'UPDATE';
            btnUpdate.onclick = () => updateConcept(concept.name, select.value, concept.is_active);

            const btnArchive = document.createElement('button');
            btnArchive.className = 'btn btn-archive';
            btnArchive.textContent = concept.is_active ? 'ARCHIVE' : 'RESTORE';
            btnArchive.onclick = () => updateConcept(concept.name, concept.category, !concept.is_active);

            actionsDiv.appendChild(btnUpdate);
            actionsDiv.appendChild(btnArchive);
            tdActions.appendChild(actionsDiv);
            tr.appendChild(tdActions);
            tbody.appendChild(tr);
        });
    }

    async function updateConcept(name, category, isActive) {
        try {
            const res = await fetch(`${API_BASE}/system/library/update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ concept_name: name, category, is_active: isActive })
            });
            const result = await res.json();
            if (result.status === 'success') {
                showToast(`Updated ${name} to ${category} (${isActive ? 'Active' : 'Archived'})`);
                performSearch();
            } else {
                showToast("Error: " + result.error, true);
            }
        } catch (err) {
            showToast("Update failed: " + err.message, true);
        }
    }

    document.getElementById('search-input').addEventListener('keypress', e => {
        if (e.key === 'Enter') performSearch();
    });

    // ══════════════════════════════════════════════════════════════
    // REVIEW QUEUE TAB
    // ══════════════════════════════════════════════════════════════

    function bucketChip(bucket) {
        const cls = { concept: 'chip-concept', insight: 'chip-insight',
                      competitor: 'chip-competitor', noise: 'chip-noise' };
        return `<span class="chip ${cls[bucket] || ''}">${bucket || '?'}</span>`;
    }

    function confidenceBar(score) {
        const pct = Math.round((score || 0) * 100);
        const color = score >= 0.85 ? '#00ff88' : score >= 0.70 ? '#ffaa00' : '#ff3377';
        return `<span class="confidence-bar"><span class="confidence-fill" style="width:${pct}%;background:${color};"></span></span>${pct}%`;
    }

    async function loadQueue(status = 'pending') {
        const tbody = document.getElementById('queue-body');
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Loading...</td></tr>';
        try {
            const res = await fetch(`${API_BASE}/system/review-queue/list?status=${status}&limit=100`);
            const data = await res.json();
            renderQueue(data.items || [], status);

            // Update badge
            if (status === 'pending') {
                const badge = document.getElementById('queue-badge');
                const n = (data.items || []).length;
                badge.textContent = n;
                badge.style.display = n > 0 ? 'inline-block' : 'none';
                document.getElementById('queue-count').textContent = `${n} item${n !== 1 ? 's' : ''} pending review`;
            }
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="8" class="empty-state">Error: ${err.message}</td></tr>`;
        }
    }

    function renderQueue(items, status) {
        const tbody = document.getElementById('queue-body');
        tbody.innerHTML = '';
        if (!items.length) {
            tbody.innerHTML = `<tr><td colspan="8" class="empty-state">No ${status} items.</td></tr>`;
            return;
        }

        items.forEach(item => {
            const tr = document.createElement('tr');
            tr.id = `qrow-${item.review_id}`;

            const signal = item.suggested_signal_category || item.suggested_game_system || '';
            const breakoutChip = item.is_breakout ? ' <span class="chip chip-breakout">BREAKOUT</span>' : '';
            const val = item.search_value ? `<span style="font-family:monospace;color:var(--color-warn)">${item.search_value}</span>` : '—';

            tr.innerHTML = `
                <td><strong>${item.term}</strong>${breakoutChip}</td>
                <td>${bucketChip(item.suggested_bucket)}</td>
                <td style="font-size:0.82rem;color:var(--text-muted)">${signal || '—'}</td>
                <td>${confidenceBar(item.confidence)}</td>
                <td>${val}</td>
                <td style="font-size:0.8rem;color:var(--text-muted)">${item.source_seed || '—'}</td>
                <td><span class="reasoning-text">${item.reasoning || '—'}</span></td>
                <td>
                    ${status === 'pending' ? `
                    <div class="action-btns">
                        <button class="btn btn-approve" onclick="queueAction('${item.review_id}','approve')">APPROVE</button>
                        <button class="btn btn-edit"    onclick="toggleEditForm('${item.review_id}')">EDIT</button>
                        <button class="btn btn-reject"  onclick="queueAction('${item.review_id}','reject')">REJECT</button>
                    </div>` : `<span style="color:var(--text-muted);font-size:0.8rem">${status}</span>`}
                </td>
            `;
            tbody.appendChild(tr);

            // Inline edit form row (hidden by default)
            if (status === 'pending') {
                const editTr = document.createElement('tr');
                editTr.id = `qedit-${item.review_id}`;
                editTr.style.display = 'none';
                editTr.innerHTML = `
                    <td colspan="8" style="padding:0">
                        <div class="edit-form" id="qform-${item.review_id}">
                            <div>
                                <label>Bucket</label>
                                <select id="ef-bucket-${item.review_id}">
                                    ${BUCKETS.map(b => `<option value="${b}" ${b === item.suggested_bucket ? 'selected' : ''}>${b}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label>Signal Category (insight)</label>
                                <select id="ef-signal-${item.review_id}">
                                    <option value="">— none —</option>
                                    ${SIGNAL_CATEGORIES.map(s => `<option value="${s}" ${s === item.suggested_signal_category ? 'selected' : ''}>${s}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label>D&amp;D Category (concept)</label>
                                <select id="ef-category-${item.review_id}">
                                    <option value="">— none —</option>
                                    ${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label>Game System (competitor)</label>
                                <input type="text" id="ef-gamesys-${item.review_id}" value="${item.suggested_game_system || ''}" placeholder="pathfinder">
                            </div>
                            <div>
                                <label>Native Category (competitor)</label>
                                <input type="text" id="ef-nativecat-${item.review_id}" value="${item.suggested_native_category || ''}" placeholder="e.g. Ancestry">
                            </div>
                            <div>
                                <label>D&amp;D Analog (competitor, nullable)</label>
                                <input type="text" id="ef-analog-${item.review_id}" value="${item.suggested_dnd_analog || ''}" placeholder="e.g. Race">
                            </div>
                            <div>
                                <label>Variant Of (concept variant)</label>
                                <input type="text" id="ef-variantof-${item.review_id}" value="${item.suggested_variant_of || ''}" placeholder="exact concept_name">
                            </div>
                            <div class="edit-form-actions">
                                <button class="btn btn-approve" onclick="queueActionWithOverrides('${item.review_id}')">APPROVE WITH EDITS</button>
                                <button class="btn btn-archive" onclick="toggleEditForm('${item.review_id}')">CANCEL</button>
                            </div>
                        </div>
                    </td>`;
                tbody.appendChild(editTr);
            }
        });
    }

    function toggleEditForm(reviewId) {
        const editRow = document.getElementById(`qedit-${reviewId}`);
        editRow.style.display = editRow.style.display === 'none' ? 'table-row' : 'none';
    }

    async function queueAction(reviewId, action, overrides = {}) {
        const key = getRitualKey();
        if (!key) return;
        try {
            const res = await fetch(`${API_BASE}/system/review-queue/action`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Ritual-Key': key },
                body: JSON.stringify({ review_id: reviewId, action, overrides })
            });
            const result = await res.json();
            if (res.ok) {
                showToast(`${action === 'approve' ? 'Approved' : 'Rejected'}: ${result.term} → ${result.destination || ''}`);
                loadQueue('pending');
            } else {
                showToast("Error: " + result.error, true);
            }
        } catch (err) {
            showToast("Action failed: " + err.message, true);
        }
    }

    async function queueActionWithOverrides(reviewId) {
        const overrides = {
            bucket:          document.getElementById(`ef-bucket-${reviewId}`).value || null,
            signal_category: document.getElementById(`ef-signal-${reviewId}`).value || null,
            category:        document.getElementById(`ef-category-${reviewId}`).value || null,
            game_system:     document.getElementById(`ef-gamesys-${reviewId}`).value || null,
            native_category: document.getElementById(`ef-nativecat-${reviewId}`).value || null,
            dnd_analog:      document.getElementById(`ef-analog-${reviewId}`).value || null,
            variant_of:      document.getElementById(`ef-variantof-${reviewId}`).value || null,
        };
        // Remove null/empty overrides
        Object.keys(overrides).forEach(k => { if (!overrides[k]) delete overrides[k]; });
        await queueAction(reviewId, 'approve', overrides);
    }

    // ══════════════════════════════════════════════════════════════
    // SEEDS TAB
    // ══════════════════════════════════════════════════════════════

    async function loadSeeds() {
        const tbody = document.getElementById('seeds-body');
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Loading...</td></tr>';
        const showInactive = document.getElementById('show-inactive-seeds').checked;
        try {
            const res = await fetch(`${API_BASE}/system/seeds/list?show_inactive=${showInactive}`);
            const data = await res.json();
            renderSeeds(data.seeds || []);
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Error: ${err.message}</td></tr>`;
        }
    }

    function renderSeeds(seeds) {
        const tbody = document.getElementById('seeds-body');
        tbody.innerHTML = '';
        if (!seeds.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No seeds found.</td></tr>';
            return;
        }
        seeds.forEach(seed => {
            const tr = document.createElement('tr');
            if (!seed.is_active) tr.className = 'seed-inactive';

            const addedDate = seed.added_at ? new Date(seed.added_at).toLocaleDateString() : '—';
            const addedByClass = seed.added_by === 'manual' ? 'seed-manual' : 'seed-auto';
            const addedByLabel = seed.added_by === 'manual' ? 'manual' : 'auto';

            tr.innerHTML = `
                <td><strong>${seed.term}</strong></td>
                <td><span class="${addedByClass}">${addedByLabel}</span></td>
                <td style="font-size:0.82rem;color:var(--text-muted)">${seed.source_concept || '—'}</td>
                <td style="font-size:0.82rem;color:var(--text-muted)">${seed.notes || '—'}</td>
                <td style="font-size:0.8rem;color:var(--text-muted)">${addedDate}</td>
                <td>
                    <div class="action-btns">
                        <button class="btn ${seed.is_active ? 'btn-toggle-on' : 'btn-toggle-off'}"
                            onclick="toggleSeed('${seed.term.replace(/'/g, "\\'")}', ${!seed.is_active})">
                            ${seed.is_active ? 'DEACTIVATE' : 'ACTIVATE'}
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function addSeed() {
        const term  = document.getElementById('new-seed-input').value.trim();
        const notes = document.getElementById('new-seed-notes').value.trim();
        if (!term) { showToast("Please enter a seed term.", true); return; }
        const key = getRitualKey();
        if (!key) return;
        try {
            const res = await fetch(`${API_BASE}/system/seeds/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Ritual-Key': key },
                body: JSON.stringify({ term, notes })
            });
            const result = await res.json();
            if (res.ok) {
                const msg = result.status === 'exists' ? `"${term}" already in seeds` : `Added seed: "${term}"`;
                showToast(msg);
                document.getElementById('new-seed-input').value = '';
                document.getElementById('new-seed-notes').value = '';
                loadSeeds();
            } else {
                showToast("Error: " + result.error, true);
            }
        } catch (err) {
            showToast("Add failed: " + err.message, true);
        }
    }

    async function toggleSeed(term, newActive) {
        const key = getRitualKey();
        if (!key) return;
        try {
            const res = await fetch(`${API_BASE}/system/seeds/toggle`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Ritual-Key': key },
                body: JSON.stringify({ term, is_active: newActive })
            });
            const result = await res.json();
            if (res.ok) {
                showToast(`"${term}" ${newActive ? 'activated' : 'deactivated'}`);
                loadSeeds();
            } else {
                showToast("Error: " + result.error, true);
            }
        } catch (err) {
            showToast("Toggle failed: " + err.message, true);
        }
    }

    // ══════════════════════════════════════════════════════════════
    // Toast
    // ══════════════════════════════════════════════════════════════
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        toast.style.background = isError ? 'rgba(255,51,119,0.9)' : 'rgba(0,212,255,0.9)';
        toast.style.color = isError ? '#fff' : '#000';
        setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    // Load queue badge on page load
    (async () => {
        try {
            const res = await fetch(`${API_BASE}/system/review-queue/list?status=pending&limit=200`);
            const data = await res.json();
            const n = (data.items || []).length;
            if (n > 0) {
                const badge = document.getElementById('queue-badge');
                badge.textContent = n;
                badge.style.display = 'inline-block';
            }
        } catch (_) {}
    })();
</script>
</body>
</html>
