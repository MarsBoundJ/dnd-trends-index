<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Library Clerk - D&D Trends</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(16, 24, 40, 0.7);
            --border-glow: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --approve-color: #22c55e;
            --reject-color: #ef4444;
            --gold: #fbbf24;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 50%);
            min-height: 100vh;
        }

        h1 {
            color: var(--gold);
            text-align: center;
            letter-spacing: 2px;
            font-weight: 300;
            text-transform: uppercase;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-sub);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .concept-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .reason-text {
            color: var(--text-sub);
            font-size: 0.9rem;
            max-width: 400px;
            line-height: 1.4;
        }

        select {
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 0.5rem;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        select:focus {
            border-color: var(--border-glow);
            box-shadow: 0 0 5px rgba(56, 189, 248, 0.4);
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .btn-approve {
            background: rgba(34, 197, 94, 0.2);
            color: var(--approve-color);
            border: 1px solid var(--approve-color);
            margin-right: 0.5rem;
        }

        .btn-approve:hover {
            background: var(--approve-color);
            color: #000;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .btn-reject {
            background: rgba(239, 68, 68, 0.2);
            color: var(--reject-color);
            border: 1px solid var(--reject-color);
        }

        .btn-reject:hover {
            background: var(--reject-color);
            color: #fff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-sub);
            font-style: italic;
        }

        .security-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }

        .security-bar input {
            background: rgba(0, 0, 0, 0.5);
            color: var(--gold);
            border: 1px solid var(--glass-border);
            padding: 0.6rem;
            border-radius: 6px;
            width: 250px;
            text-align: center;
            letter-spacing: 3px;
            font-family: monospace;
        }

        .btn-done {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-sub);
            border: 1px solid var(--text-sub);
        }

        .btn-archive {
            background: transparent;
            color: rgba(239, 68, 68, 0.6);
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 0.65rem;
            padding: 0.3rem 0.6rem;
            margin-left: 0.5rem;
        }

        .btn-archive:hover {
            border-color: var(--reject-color);
            color: var(--reject-color);
        }

        .locked {
            filter: grayscale(1) opacity(0.5);
            pointer-events: none !important;
        }

        .processing {
            opacity: 0.4 !important;
            pointer-events: none !important;
            filter: blur(1px);
        }

        .btn-loading {
            position: relative;
            color: transparent !important;
        }

        .btn-loading::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            top: 50%;
            left: 50%;
            margin: -6px 0 0 -6px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>SCRYING SCRIBE</h1>

        <div class="security-bar">
            <input type="password" id="ritualKey" placeholder="ENTER RITUAL KEY" oninput="checkRitualKey()">
            <button class="btn btn-done" onclick="lockSession()">DONE</button>
        </div>

        <div class="glass-panel">
            <table id="suggestionsTable">
                <thead>
                    <tr>
                        <th>Concept Name</th>
                        <th>Suggested Category</th>
                        <th>Reason</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="suggestionsBody">
                    <tr>
                        <td colspan="4" class="empty-state">Loading suggestions from the Bouncer API...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="toast" class="toast">Action recorded.</div>

    <script>
        const API_BASE = 'https://us-central1-dnd-trends-index.cloudfunctions.net/bouncer-api';
        const CATEGORIES = [
            "Monster", "Spell", "Mechanic", "Class", "Subclass", "Feat", "Species & Lineage",
            "Background", "Deity", "Party Role", "Equipment", "Location", "NPC", "PC", "Faction",
            "Lore", "Art", "Accessory", "Rulebooks", "Setting", "TTRPG System", "YouTube",
            "Influencer", "Actual Play", "Convention", "VTT Platform", "Other", "Uncategorized"
        ];

        async function fetchSuggestions() {
            try {
                const res = await fetch(`${API_BASE}/system/suggestions/pending`);
                const data = await res.json();

                const tbody = document.getElementById('suggestionsBody');
                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No pending AI suggestions. The library is clean.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.id = `row-${btoa(item.concept_name).replace(/=/g, '')}`;

                    // Create dropdown
                    let options = CATEGORIES.map(c =>
                        `<option value="${c}" ${c === item.suggested_category ? 'selected' : ''}>${c}</option>`
                    ).join('');

                    // Fallback if AI suggested a weird string
                    if (!CATEGORIES.includes(item.suggested_category) && item.suggested_category) {
                        options += `<option value="${item.suggested_category}" selected>${item.suggested_category}</option>`;
                    }

                    tr.innerHTML = `
                        <td class="concept-name">${item.concept_name}</td>
                        <td>
                            <select id="select-${btoa(item.concept_name).replace(/=/g, '')}">
                                ${options}
                            </select>
                        </td>
                        <td class="reason-text">${item.reason || 'No reasoning provided.'}</td>
                        <td>
                            <button class="btn btn-approve action-btn locked" onclick="handleAction('${item.concept_name}', 'APPROVE')">Approve</button>
                            <button class="btn btn-reject action-btn locked" onclick="handleAction('${item.concept_name}', 'REJECT')">Reject</button>
                            <button class="btn btn-archive action-btn locked" title="Archive Term" onclick="handleAction('${item.concept_name}', 'ARCHIVE')">📁</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('suggestionsBody').innerHTML = `<tr><td colspan="4" class="empty-state" style="color:red">Error connecting to Bouncer API.</td></tr>`;
            }
        }

        async function handleAction(conceptName, action) {
            const rowId = btoa(conceptName).replace(/=/g, '');
            const row = document.getElementById(`row-${rowId}`);

            let payload = {
                concept_name: conceptName,
                action: action
            };

            if (action === 'APPROVE') {
                const selectElement = document.getElementById(`select-${rowId}`);
                payload.category = selectElement.value;
            }

            row.classList.add('processing');
            const btns = row.querySelectorAll('.btn');
            btns.forEach(b => {
                if (b.onclick && b.onclick.toString().includes(action)) {
                    b.classList.add('btn-loading');
                }
            });

            try {
                const res = await fetch(`${API_BASE}/system/suggestions/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast(`${action === 'APPROVE' ? 'Approved' : 'Rejected'}: ${conceptName}`);

                    // Safety Buffer
                    setTimeout(() => {
                        row.remove();
                        if (document.getElementById('suggestionsBody').children.length === 0) {
                            document.getElementById('suggestionsBody').innerHTML = `<tr><td colspan="4" class="empty-state">No pending AI suggestions. The library is clean.</td></tr>`;
                        }
                    }, 500);
                } else {
                    row.classList.remove('processing');
                    btns.forEach(b => b.classList.remove('btn-loading'));
                    showToast(`Error updating ${conceptName}`, true);
                }
            } catch (e) {
                console.error(e);
                row.classList.remove('processing');
                btns.forEach(b => b.classList.remove('btn-loading'));
                showToast(`Network error updating ${conceptName}`, true);
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderColor = isError ? 'var(--reject-color)' : 'var(--approve-color)';
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        const RITUAL_KEY = "ArcaneLibrarian2026";
        let sessionTimer;

        function checkRitualKey() {
            const input = document.getElementById('ritualKey');
            const btns = document.querySelectorAll('.action-btn');

            if (input.value === RITUAL_KEY) {
                btns.forEach(b => b.classList.remove('locked'));
                resetSessionTimer();
            } else {
                btns.forEach(b => b.classList.add('locked'));
            }
        }

        function resetSessionTimer() {
            clearTimeout(sessionTimer);
            sessionTimer = setTimeout(lockSession, 15 * 60 * 1000); // 15 mins
        }

        function lockSession() {
            document.getElementById('ritualKey').value = '';
            document.querySelectorAll('.action-btn').forEach(b => b.classList.add('locked'));
            showToast("Session Locked.");
        }

        // Init
        fetchSuggestions();
    </script>
</body>

</html>
